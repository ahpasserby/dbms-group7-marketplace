name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sync website files to htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_43489551
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./public/
          server-dir: ./htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/*.sql
            **/config.local.php
